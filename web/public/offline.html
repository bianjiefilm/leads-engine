<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数海获客 · 离线</title>
    <style>
      /* 应用内离线页：不依赖网络资源。颜色全部用系统语义色，不写裸 hex。 */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 26rem;
        padding: 2rem 1.5rem;
        border: 1px solid CanvasText;
        border-radius: 12px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        line-height: 1.6;
        margin: 0 0 0.75rem;
      }
      button {
        font: inherit;
        padding: 0.65rem 1.25rem;
        min-height: 44px;
        border-radius: 8px;
        border: 1px solid CanvasText;
        background: Canvas;
        color: CanvasText;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      [data-status] {
        font-size: 0.875rem;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>你现在离线</h1>
      <p>刚才那一步没有完成。已保存的记录都在，恢复网络后重试即可继续。</p>
      <p>
        <button type="button" id="retry">重试</button>
      </p>
      <p data-status id="status">正在检查网络连接…</p>
    </main>
    <script>
      var statusEl = document.getElementById("status");
      var retryBtn = document.getElementById("retry");
      function refresh() {
        if (navigator.onLine) {
          statusEl.textContent = "网络已恢复，点「重试」回到刚才的页面。";
          retryBtn.disabled = false;
        } else {
          statusEl.textContent = "还没有网络。连上 Wi-Fi 或移动数据后再试。";
          retryBtn.disabled = true;
        }
      }
      retryBtn.addEventListener("click", function () {
        retryBtn.disabled = true;
        location.reload();
      });
      window.addEventListener("online", refresh);
      window.addEventListener("offline", refresh);
      refresh();
    </script>
  </body>
</html>
