# R17d（ap-20261011）：leads server 的 Go 门。evidence-gate 不动。
# 2026-10-14 起自托管（公司 CI Mac，mac-leads-engine-01）；server/go.mod 只有公开依赖
# （modernc.org/sqlite），无私有模块，无需跨仓凭据。live matrix 测试无 env 自动 skip，CI 零影响。
name: go-gate

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/go-gate.yml'
  push:
    paths:
      - 'server/**'
      - '.github/workflows/go-gate.yml'
  workflow_dispatch: {}

concurrency:
  group: go-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-gate:
    runs-on: [self-hosted, macOS, ARM64]  # 2026-10-14 迁公司 CI Mac 专机 mac-<repo>-01
    # 公开仓防线：fork 来的 PR 不落自托管机（现 0 fork；真出现时走人工批准/hosted）
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: build + test (GOWORK=off)
        working-directory: server
        run: |
          GOWORK=off go build ./...
          GOWORK=off go test ./... -count=1
